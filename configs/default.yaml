model:
  swin_variant: swin_tiny_patch4_window7_224
  lstm_hidden: 512
  lstm_layers: 2
  num_classes: 3
training:
  batch_size: 8
  density_loss_weight: 0.5
  density_scale: 500.0
  epochs: 6
  focal_gamma: 2.0
  grad_clip: 1.0
  label_smoothing: 0.1
  lr: 5.0e-05
  resume: false
  resume_path: checkpoints/last.pth
  risk_class_weights:
  - 8.0
  - 4.0
  - 1.0
  risk_loss_weight: 6.0
  save_every: 2
  scheduler: cosine
  seq_len: 8
  warmup_epochs: 2
  weight_decay: 0.0001
data:
  dataset: hajjv2
  frame_stride: 5
  img_size: 224
  num_workers: 0
  root: data/hajjv2
  stride: 5
paths:
  checkpoints: checkpoints
  exports: exports
  logs: logs
  results: results
inference:
  conf_threshold: 0.5
  device: cpu
  onnx_path: exports/crowd_model.onnx
  use_onnx: true
risk:
  avg_speed_threshold: 1.0
  congestion_speed: 0.45
  count_guard_ratio: 0.08
  density_high_override: 0.10
  density_moderate_override: 0.06
  density_override_area_min: 0.45
  distributed_zone_count: 4
  free_flow_speed: 0.9
  high_density: 6.0
  hotspot_share_high: 0.28
  hotspot_share_moderate: 0.20
  label_high_count: 0.105
  label_low_count: 0.070
  low_density: 2.0
  moderate_density: 4.0
  speed_drop_high: 0.35
  speed_drop_moderate: 0.15
  total_growth_high: 0.10
  total_growth_moderate: 0.05
  turbulence_low: 0.18
  turbulence_threshold: 0.3
  zone_cols: 3
  zone_growth_high: 0.05
  zone_growth_moderate: 0.02
  zone_min_share: 0.12
  zone_rows: 2
pseudo_labels:
  count_mode: hybrid
  dense_scene_threshold: 0.14
  detector_conf: 0.45
  min_detector_count: 3
  yolo_weight: 0.7